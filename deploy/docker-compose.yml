services:
  postgres:
    image: postgres:16-alpine
    container_name: home-nas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: home_nas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-nas-server
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/home_nas
      RUST_LOG: info
      BIND_ADDR: 0.0.0.0:8485
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Mount your NAS directories here
      # - /path/to/nas/media:/mnt/media:ro
      # - /path/to/nas/documents:/mnt/documents:ro
    ports:
      - "8485:8485"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
