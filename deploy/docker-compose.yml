services:
  homehub:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: homehub/server:latest
    container_name: homehub
    environment:
      CONFIG_PATH: /app/config.yaml
      BIND_ADDR: 0.0.0.0:8485
      RUST_LOG: info
    volumes:
      # Server configuration (directory registry, admin password, ...)
      - ./config.yaml:/app/config.yaml
      # Persistent state: homehub.db, trash/, originals/
      - homehub_data:/data
      # Optional: ONNX models for the `onnx` ML backend
      # - ./models:/models:ro
      #
      # Mount your NAS directories here, matching `dirs:` in config.yaml
      - /mnt/nas/photos:/mnt/nas/photos
      - /mnt/nas/videos:/mnt/nas/videos
      - /mnt/nas/documents:/mnt/nas/documents
    ports:
      # Only expose on the WireGuard interface in production, e.g.
      # "10.0.0.1:8485:8485"
      - "8485:8485"
    restart: unless-stopped

volumes:
  homehub_data:
