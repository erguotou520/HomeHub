plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// Release 签名凭据从 mobile/keystore.properties 读取（该文件与 release.jks 均不入库）。
// 文件缺失时退回 debug 签名，保证新克隆的仓库依然能直接构建。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystoreProps.containsKey('storeFile')

// 高德 SDK Key 同样不入库：优先读 local.properties 的 amapKey，其次读环境变量
// AMAP_KEY（CI 从 secret 注入）。缺失时构建照常进行，只是地图页拿不到数据。
def localPropsFile = rootProject.file('local.properties')
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def amapKey = localProps.getProperty('amapKey') ?: System.getenv('AMAP_KEY') ?: ''
if (amapKey.isEmpty()) {
    logger.lifecycle(
        "WARNING: 未配置高德 Key（local.properties 的 amapKey 或环境变量 AMAP_KEY），地图页将不可用")
}

// 版本号由 CI 从 git tag 派生后经 -P 注入（v1.2.1 → 1.2.1 / 10201）。
// 本地不传参时用这里的默认值 —— 只影响手搓的测试包，正式包一律由 tag 决定。
// versionCode 必须跨版本单调递增，否则安卓不允许覆盖安装，更新会卡在「解析包时出现问题」。
def injectedVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def injectedVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    namespace 'me.erguotou.homehub'
    compileSdk 35

    defaultConfig {
        applicationId "me.erguotou.homehub"
        minSdk 30
        targetSdk 35
        versionCode injectedVersionCode
        versionName injectedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // AMap 10.x only ships these two; keeps the APK ~20 MB smaller.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // 高德 Android SDK Key（GeoMapView 运行时经 MapsInitializer 注入）。
        // 这是产品自带的地图能力，用户不需要在应用内配置它 —— 但源码里不留明文，
        // 值从 local.properties / 环境变量取（见文件开头）。
        buildConfigField "String", "AMAP_KEY", "\"${amapKey}\""
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                // storeFile 相对 app 模块目录解析：../release.jks → mobile/release.jks
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended
    implementation libs.androidx.navigation.compose

    // WireGuard tunnel (GoBackend)
    implementation libs.wireguard.tunnel

    // Networking
    implementation libs.squareup.okhttp
    implementation libs.squareup.okhttp.logging
    implementation libs.squareup.retrofit
    implementation libs.squareup.retrofit.gson
    implementation libs.squareup.gson
    implementation libs.coil.compose

    // Video playback in the album viewer
    implementation libs.media3.exoplayer
    implementation libs.media3.ui

    // Background upload
    implementation libs.androidx.work.runtime.ktx

    // Encrypted storage + biometric gate
    implementation libs.androidx.security.crypto
    implementation libs.androidx.biometric
    implementation libs.androidx.appcompat

    // Map (geo view): AMap Android SDK. The jar ships arm64-v8a / armeabi-v7a
    // native libraries only, so restrict the ABIs instead of shipping stubs.
    implementation libs.amap.map3d

    // 应用 bsdiff 增量补丁（标准 BSDIFF40 容器，三段数据均是 bzip2 压缩）。
    // BZip2CompressorInputStream 内部要用 commons-io 的 CloseShieldInputStream，
    // 所以 commons-io 不能排；另外两个传递依赖用不上，排掉省体积。
    implementation(libs.commons.compress) {
        exclude group: 'commons-codec'
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    coreLibraryDesugaring libs.desugar.jdk.libs
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
